name: Extrair site do zip
on:
  workflow_dispatch:
  push:
    paths:
      - serva-site.zip
      - .github/workflows/publicar.yml
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair arquivos para a raiz
        run: |
          if [ ! -f serva-site.zip ]; then echo "Sem zip para extrair"; exit 0; fi
          unzip -o serva-site.zip -x '.github/*'
          git rm -q --cached serva-site.zip
          rm serva-site.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica site a partir do zip"
          git push
